<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3'lü Şans Oyunları</title>
  
    <style>
        :root {
    --bg-dark: #0b090a;
    --primary: #7b2cbf;
    --secondary: #3c096c;
    --accent: #ffd700;
    --p1-color: #10b981;
    --p2-color: #ef4444;
    --text-light: #f8f9fa;
    --font-main: 'Poppins', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-main);
}

body {
    background: radial-gradient(circle at center, #1a1a2e, var(--bg-dark));
    color: var(--text-light);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.hidden {
    display: none !important;
}

.screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    animation: epicEntrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

/* Arka Plan Mouse Glow */
#mouse-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: -1;
    background: radial-gradient(
        800px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh),
        rgba(59, 130, 246, 0.3), /* Şık mavi parlaklık */
        transparent 60%
    );
    transition: background 0.1s ease;
}

/* =========================================
   GİRİŞ ANİMASYONU (LOADER)
========================================= */
.loader-wrapper {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 1s, visibility 1s;
}

.magic-circle {
    width: 100px;
    height: 100px;
    border: 5px solid transparent;
    border-top-color: var(--accent);
    border-bottom-color: var(--primary);
    border-radius: 50%;
    animation: spin 1.5s linear infinite;
    box-shadow: 0 0 20px var(--primary);
}

.loading-text {
    margin-top: 20px;
    font-size: 1.5rem;
    color: var(--accent);
    animation: pulse 1.5s infinite;
}

@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 10px var(--accent); } }
@keyframes epicEntrance { 
    0% { opacity: 0; transform: scale(0.5) translateY(100px) rotateX(20deg); filter: blur(20px); } 
    60% { opacity: 0.8; transform: scale(1.05) translateY(-10px) rotateX(-5deg); filter: blur(0px); } 
    100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); filter: blur(0px); } 
}

/* =========================================
   ANA MENÜ
========================================= */
.main-title {
    font-size: 3rem;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent);
    margin-bottom: 10px;
    text-align: center;
}

.subtitle {
    font-size: 1.2rem;
    color: #a1a1aa;
    margin-bottom: 40px;
    text-align: center;
}

.menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 300px;
}

.btn {
    padding: 15px 20px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: linear-gradient(45deg, var(--primary), var(--secondary));
    color: white;
    transition: all 0.3s;
    text-align: center;
}

.glow-btn:hover, .glow-btn:active {
    box-shadow: 0 0 20px var(--primary);
    transform: scale(1.05);
}

.back-btn {
    margin-top: auto;
    background: transparent;
    border: 1px solid var(--primary);
    font-size: 1rem;
    padding: 10px;
    width: 100%;
    max-width: 300px;
}

/* =========================================
   OYUN ALANI & OYUNCULAR (ÜST ÜSTE)
========================================= */
#game-screen {
    justify-content: flex-start;
    padding-top: 20px;
    padding-bottom: 10px;
}

.game-board-container {
    flex-grow: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.game-board {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* OYUNCU SKORLARI - ALT ALTA */
.players-container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

.player {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    border: 2px solid transparent;
    transition: all 0.3s;
    opacity: 0.5;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.player.active {
    opacity: 1;
    transform: scale(1.02);
}

#player1.active { border-color: var(--p1-color); box-shadow: 0 0 15px rgba(16,185,129,0.4); }
#player2.active { border-color: var(--p2-color); box-shadow: 0 0 15px rgba(239,68,68,0.4); }

.player-name { font-size: 1.2rem; }
#player1 .player-name { color: var(--p1-color); }
#player2 .player-name { color: var(--p2-color); }

.score-box { font-size: 1.2rem; font-weight: bold; }
.turn-indicator { font-size: 0.8rem; color: var(--accent); opacity: 0; }
.player.active .turn-indicator { opacity: 1; animation: blink 1s infinite alternate; }

/* =========================================
   OYUN 1: KARTLAR
========================================= */
.card-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
}

.card {
    aspect-ratio: 2.5 / 3.5;
    perspective: 1000px;
    cursor: pointer;
}

.card-inner {
    width: 100%; height: 100%;
    position: relative;
    transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
}

.card.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    font-size: 1.5rem; font-weight: bold;
}

.card-front { background: linear-gradient(135deg, #1d4ed8, #3b82f6); border: 2px solid #60a5fa; }
.card-back { background: #fff; color: #000; transform: rotateY(180deg); border: 3px solid #ccc; }

.card.p1-won .card-back { border-color: var(--p1-color); box-shadow: 0 0 15px var(--p1-color); color: var(--p1-color); }
.card.p2-won .card-back { border-color: var(--p2-color); box-shadow: 0 0 15px var(--p2-color); color: var(--p2-color); }

/* =========================================
   OYUN 2: GİZEMLİ KUPA
========================================= */
.cup-container {
    display: flex; gap: 20px;
    margin: 30px 0; perspective: 1000px;
}

.cup {
    width: 80px; height: 100px;
    background: linear-gradient(135deg, #b91c1c, #7f1d1d);
    border-radius: 10px 10px 5px 5px;
    display: flex; justify-content: center; align-items: center;
    font-size: 3rem; cursor: pointer;
    box-shadow: 0 10px 20px rgba(185, 28, 28, 0.4), inset 0 -5px 15px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 2px solid #fca5a5;
    position: relative;
}

.cup:hover { transform: translateY(-10px); }

.cup.shuffling {
    animation: shuffleCup 0.4s infinite alternate;
    pointer-events: none;
}

@keyframes shuffleCup {
    0% { transform: translateX(-15px) rotate(-10deg); }
    100% { transform: translateX(15px) rotate(10deg); }
}

.cup.reveal-gold {
    transform: translateY(-40px) rotateX(20deg);
    pointer-events: none; background: transparent; border: none; box-shadow: none;
}
.cup.reveal-gold::before { content: '💰'; position: absolute; bottom: -30px; font-size: 4rem; animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

.cup.reveal-empty {
    transform: translateY(-40px) rotateX(20deg);
    pointer-events: none; background: transparent; border: none; box-shadow: none; opacity: 0.5;
}

@keyframes popUp { 0% { transform: scale(0); } 100% { transform: scale(1); } }

.action-btn { width: 100%; max-width: 200px; margin-bottom: 10px; font-size: 1.2rem; background: var(--p1-color); }
.game-info { font-size: 1.2rem; color: var(--accent); text-align: center; }

/* =========================================
   OYUN 3: MAYINLI KUTULAR
========================================= */
.box-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
    max-width: 300px;
}

.box {
    aspect-ratio: 1;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    border-radius: 15px;
    cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    font-size: 2rem;
    box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
    transition: transform 0.3s, background 0.3s;
}

.box:hover { transform: scale(1.05) translateY(-5px); }

.box.opened {
    background: #1e293b;
    pointer-events: none;
    transform: scale(0.95);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    font-size: 1.5rem;
    font-weight: bold;
}

.box.bomb { background: #ef4444 !important; color: white; animation: explode 0.5s; font-size: 3rem; }
.box.safe { color: var(--p1-color); }

@keyframes explode {
    0% { transform: scale(1); }
    50% { transform: scale(1.5); background: #fff; }
    100% { transform: scale(0.95); }
}

/* =========================================
   MODAL
========================================= */
.modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
    display: flex; justify-content: center; align-items: center;
    z-index: 100; opacity: 0; visibility: hidden; transition: all 0.5s;
}
.modal.show { opacity: 1; visibility: visible; }
.modal-content {
    background: #1e293b; padding: 40px 20px; border-radius: 20px;
    text-align: center; transform: scale(0.8); transition: transform 0.5s;
    border: 2px solid var(--accent); box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
    width: 90%; max-width: 400px;
}
.modal.show .modal-content { transform: scale(1); }
.modal h1 { font-size: 2.2rem; margin-bottom: 15px; color: var(--accent); }
.modal p { font-size: 1.2rem; margin-bottom: 25px; }
.modal-buttons { display: flex; gap: 10px; justify-content: center; flex-direction: column; }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Arka Plan Mouse Takip Efekti -->
    <div id="mouse-glow"></div>

    <!-- GİRİŞ ANİMASYONU (LOADER) -->
    <div id="loader" class="loader-wrapper">
        <div class="magic-circle"></div>
        <p class="loading-text">Oyunlar Yükleniyor...</p>
    </div>

    <!-- ANA MENÜ -->
    <div id="main-menu" class="screen hidden">
        <h1 class="main-title">Eğlence Vakti!</h1>
        <p class="subtitle">Arkadaşınla oynamak için bir oyun seç.</p>
        <div class="menu-buttons">
            <button class="btn glow-btn" onclick="startGame(1)">🃏 Şanslı Kartlar</button>
            <button class="btn glow-btn" onclick="startGame(2)">🏆 Gizemli Kupa</button>
            <button class="btn glow-btn" onclick="startGame(3)">💣 Mayınlı Kutular</button>
        </div>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-screen" class="screen hidden">
        <!-- Oyun Alanı (Yukarıda) -->
        <div id="game-board-container" class="game-board-container">
            <!-- Oyun 1: Kartlar -->
            <div id="game1-board" class="game-board hidden">
                <div class="card-grid" id="card-grid"></div>
            </div>
            
            <!-- Oyun 2: Gizemli Kupa -->
            <div id="game2-board" class="game-board hidden">
                <div class="cup-container" id="cup-container">
                    <div class="cup" onclick="selectCup(0)"></div>
                    <div class="cup" onclick="selectCup(1)"></div>
                    <div class="cup" onclick="selectCup(2)"></div>
                </div>
                <p id="cup-info" class="game-info">Altını bul, boş çıkarsa sıra geçer!</p>
            </div>

            <!-- Oyun 3: Mayınlı Kutular -->
            <div id="game3-board" class="game-board hidden">
                <div class="box-grid" id="box-grid"></div>
                <div class="box-actions" style="margin-top: 15px;">
                    <button id="withdraw-btn" class="btn action-btn" style="background: var(--accent); color: black; display: none;" onclick="withdrawPlayer()">Puanı Al ve Çekil</button>
                </div>
                <p id="box-info" class="game-info">Mayını bulmadan puanları topla!</p>
            </div>
        </div>

        <!-- Oyuncu Skorları (Alt Alta) -->
        <div class="players-container">
            <div class="player" id="player1">
                <h2 class="player-name">Oyuncu 1</h2>
                <div class="score-box">Puan: <span id="score1">0</span></div>
                <div class="turn-indicator">Sıra Sende!</div>
            </div>
            <div class="player" id="player2">
                <h2 class="player-name">Oyuncu 2</h2>
                <div class="score-box">Puan: <span id="score2">0</span></div>
                <div class="turn-indicator">Sıra Sende!</div>
            </div>
        </div>

        <button class="btn back-btn" onclick="returnToMenu()">Ana Menüye Dön</button>
    </div>

    <!-- Sonuç Ekranı -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h1 id="winnerText">Oyuncu 1 Kazandı!</h1>
            <p id="finalScores">Oyuncu 1: 300 | Oyuncu 2: 250</p>
            <div class="modal-buttons">
                <button class="btn" id="restartBtn" onclick="restartCurrentGame()">Tekrar Oyna</button>
                <button class="btn" onclick="returnToMenu()">Menüye Dön</button>
            </div>
        </div>
    </div>

    <script >
        // Arka plan glow efekti için mouse takibi
document.addEventListener('mousemove', (e) => {
    document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
    document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');
});

// DOM Elementleri
const loader = document.getElementById('loader');
const mainMenu = document.getElementById('main-menu');
const gameScreen = document.getElementById('game-screen');
const resultModal = document.getElementById('resultModal');

const player1El = document.getElementById('player1');
const player2El = document.getElementById('player2');
const score1El = document.getElementById('score1');
const score2El = document.getElementById('score2');

// Oyun Panoları
const game1Board = document.getElementById('game1-board');
const game2Board = document.getElementById('game2-board');
const game3Board = document.getElementById('game3-board');

// Global Değişkenler
let currentGameId = 0;
let currentPlayer = 1;
let score1 = 0;
let score2 = 0;

// Giriş Animasyonu
window.addEventListener('load', () => {
    setTimeout(() => {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        mainMenu.classList.remove('hidden');
    }, 1500);
});

// Menü ve Oyun Geçişleri
function startGame(gameId) {
    mainMenu.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    currentGameId = gameId;
    
    game1Board.classList.add('hidden');
    game2Board.classList.add('hidden');
    game3Board.classList.add('hidden');
    
    // Skorları Sıfırla
    score1 = 0; score2 = 0;
    currentPlayer = 1;
    updateScoreUI();
    updateTurnUI();

    if (gameId === 1) {
        game1Board.classList.remove('hidden');
        initCardGame();
    } else if (gameId === 2) {
        game2Board.classList.remove('hidden');
        initCupGame();
    } else if (gameId === 3) {
        game3Board.classList.remove('hidden');
        initBoxGame();
    }
}

function returnToMenu() {
    gameScreen.classList.add('hidden');
    resultModal.classList.remove('show');
    mainMenu.classList.remove('hidden');
}

function restartCurrentGame() {
    resultModal.classList.remove('show');
    startGame(currentGameId);
}

function updateScoreUI() {
    score1El.textContent = score1;
    score2El.textContent = score2;
}

function updateTurnUI() {
    if (currentPlayer === 1) {
        player1El.classList.add('active');
        player2El.classList.remove('active');
    } else {
        player2El.classList.add('active');
        player1El.classList.remove('active');
    }
}

function showWinner(winnerMsg, color) {
    const winnerText = document.getElementById('winnerText');
    const finalScores = document.getElementById('finalScores');
    
    winnerText.textContent = winnerMsg;
    winnerText.style.color = color;
    finalScores.textContent = `Oyuncu 1: ${score1} | Oyuncu 2: ${score2}`;
    
    setTimeout(() => {
        resultModal.classList.add('show');
    }, 800);
}

/* =======================================
   OYUN 1: ŞANSLI KARTLAR
======================================= */
let openedCards = 0;

function initCardGame() {
    const grid = document.getElementById('card-grid');
    grid.innerHTML = '';
    openedCards = 0;
    
    let numbers = [];
    while(numbers.length < 10) {
        let r = Math.floor(Math.random() * 99) + 1;
        if(numbers.indexOf(r) === -1) numbers.push(r);
    }
    
    numbers.forEach(num => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="card-inner"><div class="card-front"></div><div class="card-back">${num}</div></div>`;
        card.onclick = () => {
            if(card.classList.contains('flipped')) return;
            card.classList.add('flipped');
            openedCards++;
            
            if(currentPlayer === 1) {
                score1 += num; card.classList.add('p1-won');
            } else {
                score2 += num; card.classList.add('p2-won');
            }
            updateScoreUI();
            
            if(openedCards === 10) {
                endCardGame();
            } else {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateTurnUI();
            }
        };
        grid.appendChild(card);
    });
    
    // Kartlar oluşturulduktan sonra 3D Tilt efektini uygula
    applyTiltEffect('.card', 25, 1.05);
}

function endCardGame() {
    if(score1 > score2) showWinner('Oyuncu 1 Kazandı!', 'var(--p1-color)');
    else if(score2 > score1) showWinner('Oyuncu 2 Kazandı!', 'var(--p2-color)');
    else showWinner('Berabere!', 'var(--accent)');
}

/* =======================================
   OYUN 2: GİZEMLİ KUPA
======================================= */
/* =======================================
   OYUN 2: GİZEMLİ KUPA
======================================= */
let cupRounds = 0;
let goldIndex = -1;
let isShuffling = false;
let cupSequence = [];

function generateCupSequence() {
    // 10 turluk oyun için: her birinden en az 2 adet garanti (toplam 6)
    let seq = [0, 0, 1, 1, 2, 2];
    // Kalan 4 tur tamamen rastgele
    for (let i = 0; i < 4; i++) {
        seq.push(Math.floor(Math.random() * 3));
    }
    // Diziyi tamamen karıştır
    for (let i = seq.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [seq[i], seq[j]] = [seq[j], seq[i]];
    }
    cupSequence = seq;
}

function initCupGame() {
    cupRounds = 0;
    generateCupSequence(); // Oyun başlarken 10'luk seriyi oluştur
    document.getElementById('cup-info').textContent = `Oyuncu 1, altın hangi kupada?`;
    resetCups();
}

function resetCups() {
    const cups = document.querySelectorAll('.cup');
    cups.forEach(cup => {
        cup.className = 'cup shuffling';
        cup.innerHTML = '';
    });
    isShuffling = true;
    
    // 10'luk diziden sıradakini al (olur da tur sınırı aşılırsa normal random ver)
    goldIndex = cupRounds < cupSequence.length ? cupSequence[cupRounds] : Math.floor(Math.random() * 3);
    
    setTimeout(() => {
        cups.forEach(cup => {
            cup.className = 'cup';
            cup.innerHTML = '🏮';
        });
        isShuffling = false;
    }, 800);
}

function selectCup(index) {
    if(isShuffling) return;
    isShuffling = true; // Prevent multiple clicks
    
    const cups = document.querySelectorAll('.cup');
    let found = false;
    
    if(index === goldIndex) {
        cups[index].classList.add('reveal-gold');
        if(currentPlayer === 1) score1 += 50; else score2 += 50;
        found = true;
    } else {
        cups[index].classList.add('reveal-empty');
        cups[goldIndex].classList.add('reveal-gold');
    }
    
    updateScoreUI();
    cupRounds++;
    
    setTimeout(() => {
        if(cupRounds >= 10) {
            document.getElementById('cup-info').textContent = 'Oyun Bitti!';
            endCardGame();
        } else {
            // Eğer altını bulduysa sıra geçmez, aynı oyuncu devam eder
            if (!found) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
            }
            updateTurnUI();
            
            if (found) {
                document.getElementById('cup-info').textContent = `Doğru bildin! Oyuncu ${currentPlayer}, tekrar seç!`;
            } else {
                document.getElementById('cup-info').textContent = `Bilemedin! Oyuncu ${currentPlayer}, altın hangi kupada?`;
            }
            
            resetCups();
        }
    }, 1500);
}

/* =======================================
   OYUN 3: MAYINLI KUTULAR
======================================= */
let boxesOpened = 0;
let p1Withdrawn = false;
let p2Withdrawn = false;

function initBoxGame() {
    const grid = document.getElementById('box-grid');
    grid.innerHTML = '';
    boxesOpened = 0;
    p1Withdrawn = false;
    p2Withdrawn = false;
    document.getElementById('box-info').textContent = 'Mayını bulmadan puanları topla!';
    document.getElementById('withdraw-btn').style.display = 'inline-block';
    
    let contents = [20, 20, 30, 40, 50, 60, 70, 80, 'BOMB'];
    contents.sort(() => Math.random() - 0.5);
    
    contents.forEach(content => {
        const box = document.createElement('div');
        box.className = 'box';
        box.innerHTML = '🎁';
        
        box.onclick = () => {
            if(box.classList.contains('opened') || (currentPlayer === 1 && p1Withdrawn) || (currentPlayer === 2 && p2Withdrawn)) return;
            box.classList.add('opened');
            boxesOpened++;
            
            if(content === 'BOMB') {
                box.innerHTML = '💣';
                box.classList.add('bomb');
                document.getElementById('box-info').textContent = `💥 Oyuncu ${currentPlayer} MAYINA BASTI!`;
                
                if(currentPlayer === 1) score1 = -999; else score2 = -999;
                updateScoreUI();
                document.getElementById('withdraw-btn').style.display = 'none';
                setTimeout(() => { endCardGame(); }, 1500);
            } else {
                box.innerHTML = content;
                box.classList.add('safe');
                if(currentPlayer === 1) score1 += content;
                else score2 += content;
                
                updateScoreUI();
                
                if(boxesOpened === 9) {
                    endCardGame();
                } else {
                    passTurnIfPossible();
                }
            }
        };
        grid.appendChild(box);
    });
}

function withdrawPlayer() {
    if(currentPlayer === 1) {
        p1Withdrawn = true;
        document.getElementById('box-info').textContent = `Oyuncu 1 çekildi!`;
    } else {
        p2Withdrawn = true;
        document.getElementById('box-info').textContent = `Oyuncu 2 çekildi!`;
    }
    
    if(p1Withdrawn && p2Withdrawn) {
        document.getElementById('box-info').textContent = `İki oyuncu da çekildi!`;
        document.getElementById('withdraw-btn').style.display = 'none';
        endCardGame();
    } else {
        passTurnIfPossible();
    }
}

function passTurnIfPossible() {
    if (currentPlayer === 1) {
        if (!p2Withdrawn) currentPlayer = 2;
    } else {
        if (!p1Withdrawn) currentPlayer = 1;
    }
    updateTurnUI();
}

// 3D Tilt Efekti (Menü Butonları ve Oyuncu Kartları)
function applyTiltEffect(selector, tiltAmount = 15, scaleAmount = 1) {
    const elements = document.querySelectorAll(selector);
    elements.forEach(el => {
        el.addEventListener('mousemove', (e) => {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = ((y - centerY) / centerY) * -tiltAmount;
            const rotateY = ((x - centerX) / centerX) * tiltAmount;
            
            el.style.transform = `perspective(1000px) scale(${scaleAmount}) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        
        el.addEventListener('mouseleave', () => {
            // Hover dışına çıkınca aktifse scale'i koru, değilse normale dön
            const isScale = el.classList.contains('glow-btn') ? 1 : 1; 
            el.style.transform = `perspective(1000px) scale(${isScale}) rotateX(0deg) rotateY(0deg)`;
            
            // Eğer player active ise scale animasyonu CSS'ten geldiği için transformu temizleyelim
            if(el.classList.contains('player') || el.classList.contains('glow-btn')) {
                setTimeout(() => { el.style.transform = ''; }, 300); // 300ms sonra inline transform'u kaldır ki CSS hover/active çalışsın
            }
        });
    });
}

// Tilt efektlerini uygula (Ayar artırıldı)
applyTiltEffect('.glow-btn', 40, 1.15); // Menü butonları için daha şiddetli 3D
applyTiltEffect('.player', 25, 1.05);   // Oyuncu kartları için belirgin 3D
